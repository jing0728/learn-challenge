<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>10-Minute Learn Challenge</title><meta name="description" content="Get a topic, research it for 10 minutes, and explain it in 1 minute.">
  <style>
    :root{color-scheme:dark;--bg:#010102;--s:#0f1011;--s2:#141516;--line:#23252a;--text:#f7f8f8;--muted:#8a8f98;--accent:#5e6ad2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#5e6ad211,transparent 32%),var(--bg);color:var(--text);font:16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,select,textarea{font:inherit}button,a,select,textarea{outline-color:var(--accent)}a{color:inherit;text-decoration:none}.shell{min-height:100vh;display:flex;flex-direction:column}.top{height:72px;width:min(1180px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);font-size:13px}.nav{display:flex;gap:26px}.nav button{border:0;background:none;color:#cfd3da;cursor:pointer;padding:10px}.main{width:min(920px,calc(100% - 36px));margin:auto;flex:1;display:grid;place-items:center;padding:64px 0}.view{width:100%}.center{text-align:center}.eyebrow{color:#aeb4bd;font-size:13px;letter-spacing:.4px;margin:0 0 18px}.hero{font-size:clamp(48px,7vw,80px);line-height:1.03;letter-spacing:-3px;margin:0;font-weight:600}.hero span{color:#9095a0}.lead{max-width:650px;margin:26px auto;color:#aeb4bd;font-size:20px;line-height:1.55}.actions{display:flex;justify-content:center;gap:12px;margin-top:32px}.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:500;font-size:14px}.primary{background:var(--accent);color:white}.primary:hover{background:#828fff}.secondary{background:var(--s);border-color:var(--line);color:var(--text)}.ghost{background:transparent;color:var(--muted)}.rhythm{margin:65px auto 0;max-width:700px;display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;padding:22px;border:1px solid var(--line);border-radius:16px;background:#0f1011bb}.rhythm div{display:grid;gap:6px}.rhythm strong{font-size:20px}.rhythm span{font-size:13px;color:var(--muted)}.rhythm i{height:1px;background:var(--line)}.steps{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto 62px;border-bottom:1px solid var(--line)}.steps span{padding-bottom:13px;color:#62666d;font-size:12px}.steps .on{color:#d0d6e0;border-bottom:1px solid var(--accent);margin-bottom:-1px}.category{display:flex;justify-content:center;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:48px}.category select{background:var(--s);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px}.topic{font-size:clamp(46px,8vw,76px);line-height:1.06;letter-spacing:-2.6px;margin:0;font-weight:600}.topic.small{font-size:clamp(30px,5vw,46px);color:#d0d6e0}.meta,.instruction{color:var(--muted)}.instruction{font-size:18px}.timer{font-size:clamp(88px,17vw,158px);line-height:.95;letter-spacing:-7px;font-weight:600;font-variant-numeric:tabular-nums;margin:40px 0 22px}.dim{color:#34343a}.page-title{font-size:clamp(42px,6vw,62px);letter-spacing:-2px;margin:0}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 20px}.field{display:grid;gap:10px}.field span{font-size:14px;color:#d0d6e0}.field textarea{min-height:150px;padding:14px;resize:vertical;background:var(--s);color:var(--text);border:1px solid var(--line);border-radius:10px}.history{border-top:1px solid var(--line)}.row{width:100%;display:grid;grid-template-columns:90px 1fr 24px;gap:16px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);padding:21px 6px;cursor:pointer}.row:hover{background:var(--s)}.row time,.row small{color:var(--muted)}.row div{display:grid;gap:4px}.done{color:#58c66f}.empty{min-height:260px;display:grid;place-items:center;align-content:center;gap:18px;border:1px dashed #34343a;border-radius:16px;color:var(--muted)}.back{display:inline-block;margin-bottom:40px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:40px 0}.stats div{display:grid;gap:4px;padding:24px;background:var(--s);border:1px solid var(--line);border-radius:12px}.stats strong{font-size:36px}.answer{border-top:1px solid var(--line);padding:22px 0}.answer h3{font-size:14px;color:#d0d6e0;margin:0 0 8px}.answer p{color:var(--muted);margin:0;white-space:pre-wrap}.success{display:grid;place-items:center;width:62px;height:62px;border:1px solid #27a64455;border-radius:50%;background:#27a64420;color:#58c66f;margin:0 auto 24px;font-size:28px}footer{text-align:center;border-top:1px solid var(--line);padding:20px;color:#62666d;font-size:12px}
    .topic-machine{position:relative;max-width:820px;margin:0 auto;padding:38px 24px 34px;background:linear-gradient(180deg,#141516,#0f1011);border:1px solid #2a2c31;border-radius:18px;overflow:hidden}.topic-machine:before,.topic-machine:after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#5e6ad288,transparent)}.topic-machine:before{top:0}.topic-machine:after{bottom:0}.dice{width:66px;height:66px;margin:0 auto 28px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;background:var(--accent);border:0;border-radius:16px;cursor:pointer;box-shadow:0 10px 30px #5e6ad233;transition:transform .2s}.dice:hover{transform:rotate(-5deg) scale(1.04)}.dice.rolling{animation:diceRoll .16s linear infinite}.dot{width:7px;height:7px;place-self:center;border-radius:50%;background:white}.dot:nth-child(1){grid-area:1/1}.dot:nth-child(2){grid-area:1/3}.dot:nth-child(3){grid-area:2/1}.dot:nth-child(4){grid-area:2/2}.dot:nth-child(5){grid-area:2/3}.dot:nth-child(6){grid-area:3/1}.dot:nth-child(7){grid-area:3/3}.topic-cn{margin:12px 0 0;color:#aeb4bd;font-size:clamp(20px,3vw,29px);font-weight:400;letter-spacing:.02em}.topic-slot.rolling{animation:slotBlur .16s ease-in-out infinite alternate}.roll-label{margin:18px 0 0;color:#62666d;font-size:12px}.btn[disabled],select[disabled]{opacity:.55;cursor:not-allowed}@keyframes diceRoll{to{transform:rotate(90deg) scale(.94)}}@keyframes slotBlur{to{transform:translateY(3px);filter:blur(1.5px);opacity:.62}}
    @media(max-width:700px){.top{width:calc(100% - 28px)}.nav button:first-child{display:none}.main{padding:44px 0}.hero{letter-spacing:-2px}.lead{font-size:17px}.rhythm{grid-template-columns:1fr;gap:14px;margin-top:46px}.rhythm i{height:14px;width:1px;justify-self:center}.actions{flex-direction:column}.actions .btn{width:100%}.fields{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column;gap:20px}.timer{letter-spacing:-4px}.row{grid-template-columns:62px 1fr 20px}.topic-machine{padding:30px 16px}.dice{width:58px;height:58px}}
    .field select{min-height:48px;padding:0 14px;background:var(--s);color:var(--text);border:1px solid var(--line);border-radius:10px}.custom-list{margin-top:38px}.custom-list .row{grid-template-columns:1fr auto}.custom-list .empty{margin-top:20px}.nav{align-items:center}.lang{border:1px solid var(--line)!important;border-radius:7px!important;padding:7px 10px!important}
  </style>
</head>
<body><div class="shell"><header class="top"><button class="brand" onclick="show('home')" style="border:0;background:none;color:inherit"><span class="mark">10</span>Minute Learn</button><nav class="nav"><button id="navChallenge" onclick="openChallenge()">Challenge</button><button id="navCustom" onclick="showCustom()">My Topics</button><button id="navHistory" onclick="show('history')">History</button><button id="langBtn" class="lang" onclick="toggleLang()">中文</button></nav></header><main id="app" class="main"></main><footer id="footerText">No AI. No shortcuts. The effort is yours.</footer></div>
<script>
const groups={"Computer Science":["CAP Theorem","Byzantine Fault Tolerance","Zero-Knowledge Proof","Consistent Hashing","Eventual Consistency","Bloom Filter","Public-Key Cryptography","Garbage Collection","Dynamic Programming","Finite-State Machine","Merkle Tree","Compiler Optimization"],Technology:["Quantum Computing","Edge Computing","Digital Twin","LiDAR","WebAssembly","Containerization","Federated Learning","Network Effects","API Gateway","Content Delivery Network","Serverless Computing","Augmented Reality"],Business:["Disruptive Innovation","Blue Ocean Strategy","Jobs to Be Done","Product-Market Fit","Economies of Scale","Switching Costs","Value Chain","Market Segmentation","Competitive Moat","Lean Startup","Principal-Agent Problem","Network Business Model"],Finance:["Compound Interest","Dollar-Cost Averaging","Yield Curve","Liquidity Risk","Diversification","Price-to-Earnings Ratio","Index Fund","Options Contract","Net Present Value","Capital Structure","Efficient Market Hypothesis","Sharpe Ratio"],Economics:["Opportunity Cost","Supply Elasticity","Comparative Advantage","Moral Hazard","Tragedy of the Commons","Gini Coefficient","Inflation Targeting","Externality","Game Theory","Price Discrimination","Creative Destruction","Behavioral Economics"],Psychology:["Cognitive Dissonance","Confirmation Bias","Dunning–Kruger Effect","Sunk Cost Fallacy","Fundamental Attribution Error","Availability Heuristic","Growth Mindset","Operant Conditioning","Flow State","Loss Aversion","Bystander Effect","Cognitive Load"],Science:["Entropy","CRISPR","Plate Tectonics","General Relativity","Natural Selection","Quantum Entanglement","Epigenetics","Dark Matter","Photosynthesis","Herd Immunity","Chaos Theory","Scientific Falsifiability"],Philosophy:["The Ship of Theseus","Stoicism","Utilitarianism","Existentialism","Categorical Imperative","Occam's Razor","Problem of Induction","Social Contract","Mind–Body Problem","Moral Relativism","Determinism","Veil of Ignorance"],History:["The Silk Road","Magna Carta","Industrial Revolution","Printing Revolution","Treaty of Westphalia","Meiji Restoration","The Enlightenment","Green Revolution","Bretton Woods System","The Great Divergence","Hanseatic League","Columbian Exchange"]};
const zhGroups={"Computer Science":["CAP 定理","拜占庭容错","零知识证明","一致性哈希","最终一致性","布隆过滤器","公钥密码学","垃圾回收","动态规划","有限状态机","默克尔树","编译器优化"],Technology:["量子计算","边缘计算","数字孪生","激光雷达","WebAssembly 技术","容器化","联邦学习","网络效应","API 网关","内容分发网络","无服务器计算","增强现实"],Business:["颠覆式创新","蓝海战略","待办任务理论","产品市场契合","规模经济","转换成本","价值链","市场细分","竞争护城河","精益创业","委托代理问题","网络型商业模式"],Finance:["复利","定期定额投资","收益率曲线","流动性风险","分散投资","市盈率","指数基金","期权合约","净现值","资本结构","有效市场假说","夏普比率"],Economics:["机会成本","供给弹性","比较优势","道德风险","公地悲剧","基尼系数","通胀目标制","外部性","博弈论","价格歧视","创造性破坏","行为经济学"],Psychology:["认知失调","确认偏误","邓宁－克鲁格效应","沉没成本谬误","基本归因错误","可得性启发式","成长型思维","操作性条件反射","心流状态","损失厌恶","旁观者效应","认知负荷"],Science:["熵","CRISPR 基因编辑","板块构造论","广义相对论","自然选择","量子纠缠","表观遗传学","暗物质","光合作用","群体免疫","混沌理论","科学可证伪性"],Philosophy:["忒修斯之船","斯多葛主义","功利主义","存在主义","绝对命令","奥卡姆剃刀","归纳问题","社会契约","身心问题","道德相对主义","决定论","无知之幕"],History:["丝绸之路","大宪章","工业革命","印刷革命","威斯特伐利亚和约","明治维新","启蒙运动","绿色革命","布雷顿森林体系","大分流","汉萨同盟","哥伦布大交换"]};
groups.Philosophy.push("Plato's Allegory of the Cave","Aristotelian Virtue Ethics","Nihilism","Phenomenology","Epistemology","Free Will","The Problem of Evil","Absurdism","Pragmatism","Dualism","Empiricism","Rationalism");
zhGroups.Philosophy.push("柏拉图洞穴寓言","亚里士多德德性伦理学","虚无主义","现象学","认识论","自由意志","恶的问题","荒诞主义","实用主义","二元论","经验主义","理性主义");
groups.Sociology=["Social Stratification","Cultural Capital","Social Constructionism","Anomie","Collective Action","Social Norms","Role Conflict","Symbolic Interactionism","Structural Functionalism","Conflict Theory","Social Mobility","Groupthink","Diffusion of Innovations","Urbanization","Secularization","Social Identity","Institutional Racism","Demographic Transition","Civil Society","Mass Society"];
zhGroups.Sociology=["社会分层","文化资本","社会建构论","失范","集体行动","社会规范","角色冲突","符号互动论","结构功能主义","冲突理论","社会流动","群体迷思","创新扩散","城市化","世俗化","社会认同","制度性种族主义","人口转型","公民社会","大众社会"];
const topics=[];Object.entries(groups).forEach(([category,names])=>{const zhs=zhGroups[category];names.forEach((name,i)=>topics.push({name,zh:zhs[i],category}));names.forEach((a,i)=>names.slice(i+1).forEach((b,j)=>topics.push({name:`${a} vs. ${b}`,zh:`${zhs[i]}与${zhs[i+j+1]}`,category})));names.forEach((name,i)=>[[`${name} in Practice`,`${zhs[i]}的实际应用`],[`Limits of ${name}`,`${zhs[i]}的局限`],[`Origins of ${name}`,`${zhs[i]}的起源`]].forEach(([n,z])=>topics.push({name:n,zh:z,category}))) });
const A='learn-active',H='learn-history',C='learn-custom-topics';let active=read(A,null),history=read(H,[]),customTopics=read(C,[]),category='Random',timer=null,rolling=false,lang=localStorage.getItem('learn-lang')||'en';const app=document.getElementById('app');
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function saveActive(){active?localStorage.setItem(A,JSON.stringify(active)):localStorage.removeItem(A)}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function L(en,zh){return lang==='zh'?zh:en}function topicText(t){return lang==='zh'?(t.zh||t.name):t.name}function toggleLang(){lang=lang==='en'?'zh':'en';localStorage.setItem('learn-lang',lang);syncChrome();render()}function syncChrome(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('langBtn').textContent=lang==='en'?'中文':'EN';document.getElementById('navChallenge').textContent=L('Challenge','挑战');document.getElementById('navHistory').textContent=L('History','历史');document.getElementById('footerText').textContent=L('No AI. No shortcuts. The effort is yours.','没有 AI，没有捷径，努力属于你。')}function fmt(ms){let n=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function steps(n){let labels=lang==='zh'?['题目','研究','讲述','复盘']:['Topic','Research','Explain','Reflect'];return `<div class="steps">${labels.map((x,i)=>`<span class="${i<=n?'on':''}">${x}</span>`).join('')}</div>`}function setView(html){clearInterval(timer);app.innerHTML=`<section class="view">${html}</section>`}
function show(v,id){location.hash=id?`${v}/${id}`:v;render()}function home(){setView(`<div class="center"><p class="eyebrow">${L('Deliberate practice for curious minds','为好奇心设计的刻意练习')}</p><h1 class="hero">${L('Learn something new.<br><span>Explain it clearly.</span>','学习一个新概念。<br><span>把它清楚地讲出来。</span>')}</h1><p class="lead">${L('Get an unfamiliar topic. Research it yourself for 10 minutes. Then explain it out loud in 1 minute.','获得一个陌生题目，自主研究 10 分钟，然后用 1 分钟讲出来。')}</p><div class="actions"><button class="btn primary" onclick="openChallenge()">${active?L('Continue challenge','继续挑战'):L('Start a challenge','开始挑战')} →</button><button class="btn secondary" onclick="show('history')">${L('View history','查看历史')}</button></div><div class="rhythm"><div><strong>01</strong><span>${L('Get a topic','获得题目')}</span></div><i></i><div><strong>10:00</strong><span>${L('Research','研究')}</span></div><i></i><div><strong>01:00</strong><span>${L('Explain','讲述')}</span></div></div></div>`)}
function getPool(){let recent=history.slice(0,10).map(x=>x.topic.name);return topics.filter(x=>(category==='Random'||x.category===category)&&x.name!==active?.topic?.name&&!recent.includes(x.name))}function choose(){let p=getPool();active={topic:p[Math.floor(Math.random()*p.length)],phase:'topic',startedAt:Date.now()};saveActive();challenge()}function roll(){if(rolling)return;rolling=true;let p=getPool(),count=0;document.querySelector('.topic-slot')?.classList.add('rolling');document.querySelectorAll('button,select').forEach(x=>x.disabled=true);let spin=setInterval(()=>{let t=p[Math.floor(Math.random()*p.length)],el=document.getElementById('topic-text');if(el)el.textContent=topicText(t);if(++count>=16){clearInterval(spin);active={topic:t,phase:'topic',startedAt:Date.now()};saveActive();rolling=false;challenge()}},58)}function openChallenge(){location.hash='challenge';if(!active)choose();else challenge()}
function challenge(){if(!active)return choose();let a=active;if(a.phase==='research'&&a.end&&Date.now()>=a.end){a.phase='ready';delete a.end;saveActive()}if(a.phase==='speak'&&a.end&&Date.now()>=a.end){a.phase='reflection';delete a.end;saveActive();return reflection()}if(a.phase==='reflection')return reflection();if(a.phase==='complete')return complete();let n=a.phase==='topic'?0:a.phase==='research'?1:2,body='';if(a.phase==='topic')body=`<label class="category">Choose a category / 选择分类 <select onchange="category=this.value;roll()">${['Random',...Object.keys(groups)].map(x=>`<option ${x===category?'selected':''}>${x}</option>`).join('')}</select></label><div class="topic-machine"><button class="dice" onclick="roll()" aria-label="Roll a new topic"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></button><p class="eyebrow">Your topic / 你的题目</p><div class="topic-slot"><h1 id="topic-en" class="topic">${esc(a.topic.name)}</h1><h2 id="topic-zh" class="topic-cn">${esc(a.topic.zh||a.topic.name)}</h2></div><p class="roll-label">Click the dice to roll · 点击骰子重新抽题</p></div><p class="meta">${a.topic.category}</p><div class="actions"><button class="btn primary" onclick="startResearch()">Start challenge / 开始挑战 →</button><button class="btn secondary" onclick="roll()">Roll again / 再抽一次</button></div>`;if(a.phase==='research')body=`<p class="eyebrow">Research time / 研究时间</p><h1 class="topic small">${esc(a.topic.name)}</h1><p class="topic-cn">${esc(a.topic.zh||a.topic.name)}</p><div id="timer" class="timer"></div><p class="instruction">Research this topic using any sources you want. / 使用任意资料自主研究。</p><div class="actions">${a.paused?'<button class="btn primary" onclick="resume()">▶ Resume / 继续</button>':'<button class="btn secondary" onclick="pause()">Ⅱ Pause / 暂停</button>'}<button class="btn ghost" onclick="endResearch()">End research early / 提前结束</button></div>`;if(a.phase==='ready')body=`<p class="eyebrow">Research complete / 研究完成</p><h1 class="topic small">${esc(a.topic.name)}</h1><p class="topic-cn">${esc(a.topic.zh||a.topic.name)}</p><div class="timer dim">01:00</div><p class="instruction">Explain what you learned out loud in your own words. / 用自己的话讲出所学内容。</p><div class="actions"><button class="btn primary" onclick="startSpeaking()">▶ Start speaking / 开始讲述</button></div>`;if(a.phase==='speak')body=`<p class="eyebrow">Explain it / 讲出来</p><h1 class="topic small">${esc(a.topic.name)}</h1><p class="topic-cn">${esc(a.topic.zh||a.topic.name)}</p><div id="timer" class="timer"></div><p class="instruction">Keep going. Clarity matters more than completeness. / 清晰比完整更重要。</p><div class="actions"><button class="btn secondary" onclick="finishSpeaking()">Finish early / 提前结束 →</button></div>`;setView(`<div class="center">${steps(n)}${body}</div>`);if(a.phase==='research'||a.phase==='speak')tick()}
function startResearch(){active.phase='research';active.end=Date.now()+600000;saveActive();challenge()}function pause(){active.paused=Math.max(0,active.end-Date.now());delete active.end;saveActive();challenge()}function resume(){active.end=Date.now()+active.paused;delete active.paused;saveActive();challenge()}function endResearch(){active.phase='ready';delete active.end;delete active.paused;saveActive();challenge()}function startSpeaking(){active.phase='speak';active.end=Date.now()+60000;saveActive();challenge()}function finishSpeaking(){active.phase='reflection';delete active.end;saveActive();reflection()}function tick(){clearInterval(timer);let update=()=>{if(!active)return;let left=active.paused??active.end-Date.now(),el=document.getElementById('timer');if(el)el.textContent=fmt(left);if(left<=0){clearInterval(timer);challenge()}};update();timer=setInterval(update,250)}
function reflection(){location.hash='reflection';setView(`${steps(3)}<p class="eyebrow">Final step</p><h1 class="page-title">Reflection</h1><p class="meta">${esc(active.topic.name)}</p><div class="fields">${[['learned','What did you learn?'],['difficult','What was difficult to explain?'],['improve','What would you improve next time?']].map(([k,l])=>`<label class="field"><span>${l}</span><textarea id="${k}" placeholder="Optional"></textarea></label>`).join('')}</div><button class="btn primary" onclick="finish()">Save & finish ✓</button>`)}function finish(){let item={id:crypto.randomUUID(),topic:active.topic,date:new Date().toISOString(),researchDuration:600,speakingDuration:60,reflection:{learned:document.getElementById('learned').value,difficult:document.getElementById('difficult').value,improve:document.getElementById('improve').value}};history=[item,...history];localStorage.setItem(H,JSON.stringify(history));active.phase='complete';saveActive();complete()}function complete(){setView(`<div class="center"><div class="success">✓</div><p class="eyebrow">Challenge complete</p><h1 class="page-title">${esc(active.topic.name)}</h1><p class="meta">10 min research · 1 min explanation</p><div class="actions"><button class="btn primary" onclick="active=null;saveActive();openChallenge()">New challenge</button><button class="btn secondary" onclick="show('history')">View history</button></div></div>`)}
function historyView(){setView(`<div class="heading"><div><p class="eyebrow">Your practice</p><h1 class="page-title">History</h1></div><button class="btn primary" onclick="active=null;saveActive();openChallenge()">New challenge</button></div>${history.length?`<div class="history">${history.map(x=>`<button class="row" onclick="show('detail','${x.id}')"><time>${new Date(x.date).toLocaleDateString('en',{month:'short',day:'numeric'})}</time><div><strong>${esc(x.topic.name)}</strong><small>${x.topic.category}</small></div><span class="done">✓</span></button>`).join('')}</div>`:`<div class="empty"><span>No completed challenges yet</span><button class="btn primary" onclick="openChallenge()">Start your first</button></div>`}`)}function detail(id){let x=history.find(y=>y.id===id);if(!x)return historyView();let items=[['What did you learn?',x.reflection.learned],['What was difficult to explain?',x.reflection.difficult],['What would you improve next time?',x.reflection.improve]];setView(`<button class="back" onclick="show('history')">← History</button><p class="eyebrow">Completed practice</p><h1 class="page-title">${esc(x.topic.name)}</h1><p class="meta">${new Date(x.date).toLocaleDateString('en',{dateStyle:'long'})}</p><div class="stats"><div><strong>10</strong><span>minutes research</span></div><div><strong>1</strong><span>minute speaking</span></div></div><h2>Reflection</h2>${items.map(([l,v])=>`<section class="answer"><h3>${l}</h3><p>${esc(v||'No note added.')}</p></section>`).join('')}`)}
function render(){let [v,id]=(location.hash.slice(1)||'home').split('/');if(v==='challenge')openChallenge();else if(v==='reflection'&&active)reflection();else if(v==='history')historyView();else if(v==='detail')detail(id);else home()}window.addEventListener('hashchange',render);render();
</script>
<script>
challenge=function(){if(!active)return choose();let a=active;if(a.phase==='research'&&a.end&&Date.now()>=a.end){a.phase='ready';delete a.end;saveActive()}if(a.phase==='speak'&&a.end&&Date.now()>=a.end){a.phase='reflection';delete a.end;saveActive();return reflection()}if(a.phase==='reflection')return reflection();if(a.phase==='complete')return complete();let n=a.phase==='topic'?0:a.phase==='research'?1:2,body='';if(a.phase==='topic'){let cn={Random:L('Random','随机'),"Computer Science":L('Computer Science','计算机科学'),Technology:L('Technology','科技'),Business:L('Business','商业'),Finance:L('Finance','金融'),Economics:L('Economics','经济学'),Psychology:L('Psychology','心理学'),Science:L('Science','科学'),Philosophy:L('Philosophy','哲学'),Sociology:L('Sociology','社会学'),History:L('History','历史')};body=`<label class="category">${L('Choose a category','选择分类')} <select onchange="category=this.value;roll()">${['Random',...Object.keys(groups)].map(x=>`<option value="${x}" ${x===category?'selected':''}>${cn[x]}</option>`).join('')}</select></label><div class="topic-machine"><p class="eyebrow">${L('Your topic','你的题目')}</p><div class="topic-slot"><h1 id="topic-text" class="topic">${esc(topicText(a.topic))}</h1></div><p class="roll-label">${L('Topics roll quickly, then settle on one.','题目会快速滚动，然后随机停下。')}</p></div><p class="meta">${cn[a.topic.category]||a.topic.category}</p><div class="actions"><button class="btn primary" onclick="startResearch()">${L('Start challenge','开始挑战')} →</button><button class="btn secondary" onclick="roll()">${L('Roll another topic','再随机一个题目')}</button></div>`}else{let title=esc(topicText(a.topic));if(a.phase==='research')body=`<p class="eyebrow">${L('Research time','研究时间')}</p><h1 class="topic small">${title}</h1><div id="timer" class="timer"></div><p class="instruction">${L('Research this topic using any sources you want.','使用任意资料自主研究这个题目。')}</p><div class="actions">${a.paused?`<button class="btn primary" onclick="resume()">▶ ${L('Resume','继续')}</button>`:`<button class="btn secondary" onclick="pause()">Ⅱ ${L('Pause','暂停')}</button>`}<button class="btn ghost" onclick="endResearch()">${L('End research early','提前结束研究')}</button></div>`;if(a.phase==='ready')body=`<p class="eyebrow">${L('Research complete','研究完成')}</p><h1 class="topic small">${title}</h1><div class="timer dim">01:00</div><p class="instruction">${L('Explain what you learned out loud in your own words.','用自己的话讲出你学到的内容。')}</p><div class="actions"><button class="btn primary" onclick="startSpeaking()">▶ ${L('Start speaking','开始讲述')}</button></div>`;if(a.phase==='speak')body=`<p class="eyebrow">${L('Explain it','讲出来')}</p><h1 class="topic small">${title}</h1><div id="timer" class="timer"></div><p class="instruction">${L('Keep going. Clarity matters more than completeness.','继续讲，清晰比完整更重要。')}</p><div class="actions"><button class="btn secondary" onclick="finishSpeaking()">${L('Finish early','提前结束')} →</button></div>`}setView(`<div class="center">${steps(n)}${body}</div>`);if(a.phase==='research'||a.phase==='speak')tick()};syncChrome();render();
</script>
<script>
reflection=function(){location.hash='reflection';let fields=lang==='zh'?[['learned','你学到了什么？'],['difficult','什么内容最难讲清楚？'],['improve','下次你会如何改进？']]:[['learned','What did you learn?'],['difficult','What was difficult to explain?'],['improve','What would you improve next time?']];setView(`${steps(3)}<p class="eyebrow">${L('Final step','最后一步')}</p><h1 class="page-title">${L('Reflection','复盘')}</h1><p class="meta">${esc(topicText(active.topic))}</p><div class="fields">${fields.map(([k,l])=>`<label class="field"><span>${l}</span><textarea id="${k}" placeholder="${L('Optional','选填')}"></textarea></label>`).join('')}</div><button class="btn primary" onclick="finish()">${L('Save & finish','保存并完成')} ✓</button>`)};
complete=function(){setView(`<div class="center"><div class="success">✓</div><p class="eyebrow">${L('Challenge complete','挑战完成')}</p><h1 class="page-title">${esc(topicText(active.topic))}</h1><p class="meta">${L('10 min research · 1 min explanation','研究 10 分钟 · 讲述 1 分钟')}</p><div class="actions"><button class="btn primary" onclick="active=null;saveActive();openChallenge()">${L('New challenge','新挑战')}</button><button class="btn secondary" onclick="show('history')">${L('View history','查看历史')}</button></div></div>`)};
historyView=function(){setView(`<div class="heading"><div><p class="eyebrow">${L('Your practice','你的练习')}</p><h1 class="page-title">${L('History','历史')}</h1></div><button class="btn primary" onclick="active=null;saveActive();openChallenge()">${L('New challenge','新挑战')}</button></div>${history.length?`<div class="history">${history.map(x=>`<button class="row" onclick="show('detail','${x.id}')"><time>${new Date(x.date).toLocaleDateString(lang==='zh'?'zh-CN':'en',{month:'short',day:'numeric'})}</time><div><strong>${esc(topicText(x.topic))}</strong><small>${x.topic.category}</small></div><span class="done">✓</span></button>`).join('')}</div>`:`<div class="empty"><span>${L('No completed challenges yet','还没有完成的挑战')}</span><button class="btn primary" onclick="openChallenge()">${L('Start your first','开始第一次挑战')}</button></div>`}`)};
detail=function(id){let x=history.find(y=>y.id===id);if(!x)return historyView();let labels=lang==='zh'?['你学到了什么？','什么内容最难讲清楚？','下次你会如何改进？']:['What did you learn?','What was difficult to explain?','What would you improve next time?'],values=[x.reflection.learned,x.reflection.difficult,x.reflection.improve];setView(`<button class="back" onclick="show('history')">← ${L('History','历史')}</button><p class="eyebrow">${L('Completed practice','已完成练习')}</p><h1 class="page-title">${esc(topicText(x.topic))}</h1><p class="meta">${new Date(x.date).toLocaleDateString(lang==='zh'?'zh-CN':'en',{dateStyle:'long'})}</p><div class="stats"><div><strong>10</strong><span>${L('minutes research','分钟研究')}</span></div><div><strong>1</strong><span>${L('minute speaking','分钟讲述')}</span></div></div><h2>${L('Reflection','复盘')}</h2>${labels.map((label,i)=>`<section class="answer"><h3>${label}</h3><p>${esc(values[i]||L('No note added.','没有填写。'))}</p></section>`).join('')}`)};
syncChrome();render();
</script>
<script>
syncChrome=function(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('langBtn').textContent=lang==='en'?'中文':'EN';document.getElementById('navChallenge').textContent=L('Challenge','挑战');document.getElementById('navCustom').textContent=L('My Topics','我的题目');document.getElementById('navHistory').textContent=L('History','历史');document.getElementById('footerText').textContent=L('No AI. No shortcuts. The effort is yours.','没有 AI，没有捷径，努力属于你。')};
getPool=function(){let recent=history.slice(0,10).map(x=>x.topic.name);return [...topics,...customTopics].filter(x=>(category==='Random'||x.category===category)&&x.name!==active?.topic?.name&&!recent.includes(x.name))};
showCustom=function(){location.hash='custom';let options=Object.keys(groups).map(x=>`<option value="${x}">${x}</option>`).join('');setView(`<button class="back" onclick="show('home')">← ${L('Home','首页')}</button><p class="eyebrow">${L('Build your own practice set','创建自己的练习题库')}</p><h1 class="page-title">${L('My topics','我的题目')}</h1><p class="meta">${L('Custom topics stay in this browser and join the random topic pool.','自定义题目保存在当前浏览器，并参与随机抽题。')}</p><div class="fields"><label class="field"><span>${L('English topic','英文题目')}</span><textarea id="customEn" rows="2" placeholder="e.g. Social Exchange Theory"></textarea></label><label class="field"><span>${L('Chinese topic','中文题目')}</span><textarea id="customZh" rows="2" placeholder="例如：社会交换理论"></textarea></label><label class="field"><span>${L('Category','分类')}</span><select id="customCategory">${options}</select></label></div><button class="btn primary" onclick="addCustomTopic()">${L('Add topic','添加题目')}</button><div class="history custom-list">${customTopics.length?customTopics.map(x=>`<div class="row"><div><strong>${esc(topicText(x))}</strong><small>${x.category}</small></div><button class="btn ghost" onclick="removeCustomTopic('${x.id}')">${L('Delete','删除')}</button></div>`).join(''):`<div class="empty"><span>${L('No custom topics yet.','还没有自定义题目。')}</span></div>`}</div>`)};
addCustomTopic=function(){let en=document.getElementById('customEn').value.trim(),zh=document.getElementById('customZh').value.trim(),cat=document.getElementById('customCategory').value;if(!en&&!zh)return;customTopics.push({id:crypto.randomUUID(),name:en||zh,zh:zh||en,category:cat,custom:true});localStorage.setItem(C,JSON.stringify(customTopics));showCustom()};
removeCustomTopic=function(id){customTopics=customTopics.filter(x=>x.id!==id);localStorage.setItem(C,JSON.stringify(customTopics));showCustom()};
const baseRender=render;render=function(){let v=(location.hash.slice(1)||'home').split('/')[0];if(v==='custom')showCustom();else baseRender()};syncChrome();render();
</script></body></html>
